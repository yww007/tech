<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云原生技术实践 - 2026年04月28日 | 技术文档</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: white;
            --text-color: #333;
            --nav-bg: white;
            --nav-text: #333;
            --border-color: rgba(0,0,0,0.1);
            --bg-image: url('../../../images/website-background-8k.png');
        }
        .dark-mode {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --container-bg: #1a1a2e;
            --text-color: #e0e0e0;
            --nav-bg: #1f1f38;
            --nav-text: #e0e0e0;
            --border-color: rgba(255,255,255,0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.88);
            z-index: -1;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .navbar-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--nav-text);
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        .nav-links a {
            color: var(--nav-text);
            text-decoration: none;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #667eea;
        }
        .hero {
            background: var(--bg-gradient);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }
        .hero h1 { font-size: 2.2em; margin-bottom: 15px; }
        .hero p { font-size: 1.1em; opacity: 0.9; }
        .hero-date { margin-top: 15px; font-size: 0.9em; opacity: 0.8; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .back-link:hover { background: rgba(255,255,255,0.3); }
        .content { padding: 40px 30px; }
        .content h2 {
            font-size: 1.8em;
            margin: 30px 0 15px 0;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        .content p { margin-bottom: 15px; line-height: 1.8; }
        .content pre {
            background: #f6f8fa;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            margin: 15px 0;
        }
        .content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 0.9em;
            border-top: 1px solid var(--border-color);
        }
        .article-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .article-card h3 { color: #667eea; margin-bottom: 10px; }
        .article-card p { color: #666; line-height: 1.6; }
        .article-card a { color: #667eea; text-decoration: none; }
        .article-card a:hover { text-decoration: underline; }
    </style>

</head>

            <div class="hero-date">2026年04月28日</div>

        </div>
        <div class="content">

        </div>
        <div class="footer">

        </div>
    </div>
</body>
